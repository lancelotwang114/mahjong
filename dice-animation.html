<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻將骰子動畫</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{width:100%;height:100%;background:#040d1a;overflow:hidden;font-family:'Noto Serif TC','Georgia',serif}

  /* ── Tray ── */
  @keyframes trayIn{
    0%{opacity:0;transform:scale(.7) translateY(30px)}
    60%{opacity:1;transform:scale(1.04) translateY(-4px)}
    100%{opacity:1;transform:scale(1) translateY(0)}
  }
  @keyframes trayPulse{
    0%,100%{box-shadow:0 0 30px 4px rgba(200,158,40,.35),0 0 80px 10px rgba(200,158,40,.12),inset 0 0 40px rgba(200,158,40,.06)}
    50%{box-shadow:0 0 50px 10px rgba(220,178,60,.55),0 0 120px 20px rgba(200,158,40,.22),inset 0 0 60px rgba(200,158,40,.12)}
  }
  @keyframes feltShimmer{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  /* ── Dice flight paths ── */
  @keyframes dice1Arc{
    0%  {transform:translate(0px,0px) rotate(0deg);opacity:1}
    8%  {transform:translate(-18px,-55px) rotate(-324deg)}
    20% {transform:translate(-55px,-95px) rotate(-864deg)}
    32% {transform:translate(-90px,-60px) rotate(-1458deg)}
    40% {transform:translate(-105px,0px) rotate(-1836deg)}
    42% {transform:translate(-108px,6px) rotate(-1917deg) scaleY(.82)}
    48% {transform:translate(-98px,-32px) rotate(-2106deg)}
    58% {transform:translate(-88px,0px) rotate(-2349deg)}
    60% {transform:translate(-89px,4px) rotate(-2376deg) scaleY(.88)}
    72% {transform:translate(-82px,-18px) rotate(-2538deg)}
    82% {transform:translate(-76px,0px) rotate(-2646deg)}
    84% {transform:translate(-76px,3px) rotate(-2657deg) scaleY(.93)}
    93% {transform:translate(-74px,-6px) rotate(-2700deg)}
    100%{transform:translate(-72px,0px) rotate(-2754deg);opacity:1}
  }
  @keyframes dice2Arc{
    0%  {transform:translate(0px,0px) rotate(0deg);opacity:1}
    10% {transform:translate(22px,-60px) rotate(410deg)}
    22% {transform:translate(60px,-100px) rotate(1055deg)}
    30% {transform:translate(95px,-55px) rotate(1524deg)}
    38% {transform:translate(110px,0px) rotate(1934deg)}
    40% {transform:translate(113px,7px) rotate(1992deg) scaleY(.8)}
    47% {transform:translate(100px,-28px) rotate(2168deg)}
    56% {transform:translate(90px,0px) rotate(2403deg)}
    58% {transform:translate(91px,5px) rotate(2426deg) scaleY(.87)}
    70% {transform:translate(84px,-14px) rotate(2564deg)}
    80% {transform:translate(78px,0px) rotate(2666deg)}
    82% {transform:translate(78px,3px) rotate(2678deg) scaleY(.93)}
    91% {transform:translate(76px,-5px) rotate(2719deg)}
    100%{transform:translate(74px,0px) rotate(2756deg);opacity:1}
  }

  /* ── Dice glow/shadow ── */
  @keyframes diceRollGlow{
    0%,100%{filter:drop-shadow(0 0 8px rgba(200,158,40,.6)) drop-shadow(0 8px 12px rgba(0,0,0,.8))}
    50%{filter:drop-shadow(0 0 18px rgba(220,178,60,.9)) drop-shadow(0 10px 16px rgba(0,0,0,.9))}
  }
  @keyframes diceSettleGlow{
    0%{filter:drop-shadow(0 0 20px rgba(220,178,60,1)) drop-shadow(0 12px 20px rgba(0,0,0,.9))}
    100%{filter:drop-shadow(0 0 10px rgba(200,158,40,.5)) drop-shadow(0 6px 10px rgba(0,0,0,.7))}
  }

  /* ── Shadow on floor ── */
  @keyframes shadow1Anim{
    0%  {transform:translate(-50%,0) scaleX(.15);opacity:.1}
    38% {transform:translate(-50%,0) scaleX(1);opacity:.55}
    42% {transform:translate(-50%,0) scaleX(.7);opacity:.35}
    56% {transform:translate(-50%,0) scaleX(.9);opacity:.5}
    60% {transform:translate(-50%,0) scaleX(.72);opacity:.38}
    82% {transform:translate(-50%,0) scaleX(.88);opacity:.48}
    100%{transform:translate(-50%,0) scaleX(.85);opacity:.42}
  }
  @keyframes shadow2Anim{
    0%  {transform:translate(-50%,0) scaleX(.15);opacity:.1}
    40% {transform:translate(-50%,0) scaleX(1);opacity:.55}
    44% {transform:translate(-50%,0) scaleX(.68);opacity:.32}
    58% {transform:translate(-50%,0) scaleX(.92);opacity:.5}
    62% {transform:translate(-50%,0) scaleX(.70);opacity:.36}
    83% {transform:translate(-50%,0) scaleX(.87);opacity:.46}
    100%{transform:translate(-50%,0) scaleX(.84);opacity:.40}
  }

  /* ── Screen shake on first bounce ── */
  @keyframes screenShake{
    0%  {transform:translate(0,0)}
    10% {transform:translate(-4px,3px)}
    20% {transform:translate(5px,-4px)}
    30% {transform:translate(-3px,4px)}
    40% {transform:translate(4px,-2px)}
    50% {transform:translate(-2px,3px)}
    60% {transform:translate(3px,-1px)}
    70% {transform:translate(-2px,2px)}
    80% {transform:translate(1px,-1px)}
    90% {transform:translate(-1px,1px)}
    100%{transform:translate(0,0)}
  }

  /* ── Particles ── */
  @keyframes particleUp{
    0%  {opacity:1;transform:translate(var(--px),var(--py)) scale(1)}
    100%{opacity:0;transform:translate(calc(var(--px) + var(--dx)),calc(var(--py) - var(--dy))) scale(0)}
  }

  /* ── Result reveal ── */
  @keyframes resultReveal{
    0%  {opacity:0;transform:translateY(18px) scale(.88)}
    60% {opacity:1;transform:translateY(-3px) scale(1.03)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes resultGlow{
    0%,100%{text-shadow:0 0 20px rgba(200,158,40,.7),0 0 40px rgba(200,158,40,.3)}
    50%{text-shadow:0 0 35px rgba(220,178,60,1),0 0 70px rgba(200,158,40,.5)}
  }
  @keyframes scanLine{
    0%{transform:translateY(-100%)}
    100%{transform:translateY(100%)}
  }
  @keyframes borderFlash{
    0%,100%{border-color:rgba(200,158,40,.5)}
    50%{border-color:rgba(220,178,60,1)}
  }

  /* ── Ambient particles ── */
  @keyframes ambientDrift{
    0%  {transform:translate(0,0);opacity:0}
    10% {opacity:.6}
    90% {opacity:.4}
    100%{transform:translate(var(--adx),var(--ady));opacity:0}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const {useState,useEffect,useRef,useMemo,useCallback}=React;

/* ════════════════════════════════════════════
   Die SVG — dots for any value 1-6
   ════════════════════════════════════════════ */
const DOT_MAP={
  1:[[50,50,10,'#e03030']],
  2:[[28,28,7.5,'#f0f0f0'],[72,72,7.5,'#f0f0f0']],
  3:[[28,28,7,'#f0f0f0'],[50,50,7,'#f0f0f0'],[72,72,7,'#f0f0f0']],
  4:[[28,28,7,'#f0f0f0'],[72,28,7,'#f0f0f0'],[28,72,7,'#f0f0f0'],[72,72,7,'#f0f0f0']],
  5:[[28,28,6.5,'#f0f0f0'],[72,28,6.5,'#f0f0f0'],[50,50,6.5,'#e03030'],[28,72,6.5,'#f0f0f0'],[72,72,6.5,'#f0f0f0']],
  6:[[28,22,6.5,'#f0f0f0'],[72,22,6.5,'#f0f0f0'],[28,50,6.5,'#f0f0f0'],[72,50,6.5,'#f0f0f0'],[28,78,6.5,'#f0f0f0'],[72,78,6.5,'#f0f0f0']],
};

function DiceSVG({value=1,size=90,id='d0',rolling=false}){
  const uid=`dg_${id}`;
  const dots=DOT_MAP[value]||DOT_MAP[1];
  return(
    <svg width={size} height={size} viewBox="0 0 100 100" style={{overflow:'visible',display:'block'}}>
      <defs>
        <linearGradient id={`face_${uid}`} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#1a2e5a"/>
          <stop offset="50%" stopColor="#0d1c3a"/>
          <stop offset="100%" stopColor="#061025"/>
        </linearGradient>
        <linearGradient id={`border_${uid}`} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#ffe066"/>
          <stop offset="30%" stopColor="#c8960a"/>
          <stop offset="70%" stopColor="#ffd700"/>
          <stop offset="100%" stopColor="#a07010"/>
        </linearGradient>
        <linearGradient id={`bevel_${uid}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="rgba(255,255,255,.18)"/>
          <stop offset="100%" stopColor="rgba(255,255,255,0)"/>
        </linearGradient>
      </defs>
      {/* outer glow ring */}
      <rect x="1" y="1" width="98" height="98" rx="20" fill="none"
        stroke="rgba(200,158,40,.25)" strokeWidth="2"/>
      {/* main face */}
      <rect x="4" y="4" width="92" height="92" rx="17"
        fill={`url(#face_${uid})`}
        stroke={`url(#border_${uid})`} strokeWidth="2.5"/>
      {/* top bevel highlight */}
      <rect x="7" y="7" width="86" height="42" rx="13"
        fill={`url(#bevel_${uid})`}/>
      {/* inner corner inset */}
      <rect x="6" y="6" width="88" height="88" rx="16" fill="none"
        stroke="rgba(255,255,255,.06)" strokeWidth="1"/>
      {/* dots */}
      {dots.map(([cx,cy,r,fill],i)=>(
        <circle key={i} cx={cx} cy={cy} r={r} fill={fill}
          filter={rolling?'none':`drop-shadow(0 1px 2px rgba(0,0,0,.8))`}/>
      ))}
      {/* rolling blur overlay */}
      {rolling&&(
        <rect x="4" y="4" width="92" height="92" rx="17"
          fill="rgba(10,20,50,.45)"/>
      )}
    </svg>
  );
}

/* ════════════════════════════════════════════
   Particle component
   ════════════════════════════════════════════ */
function Particles({active,originX,originY,count=20}){
  const particles=useMemo(()=>Array.from({length:count},(_,i)=>{
    const angle=(Math.PI*2*i/count)+(Math.random()*.5-.25);
    const dist=30+Math.random()*60;
    const delay=Math.random()*0.12;
    const dur=0.5+Math.random()*0.5;
    return{
      id:i,
      px:Math.cos(angle)*10,
      py:Math.sin(angle)*10,
      dx:Math.cos(angle)*dist,
      dy:Math.abs(Math.sin(angle)*dist)+20,
      delay,dur,
      size:2+Math.random()*4,
      opacity:0.7+Math.random()*0.3,
    };
  }),[count]);

  if(!active)return null;
  return(
    <div style={{position:'absolute',left:originX,top:originY,pointerEvents:'none',zIndex:20}}>
      {particles.map(p=>(
        <div key={p.id} style={{
          position:'absolute',
          width:p.size,height:p.size,
          borderRadius:'50%',
          background:`radial-gradient(circle,#ffe566,#c8a000)`,
          boxShadow:`0 0 ${p.size*2}px rgba(200,158,40,.8)`,
          '--px':`${p.px}px`,
          '--py':`${p.py}px`,
          '--dx':`${p.dx}px`,
          '--dy':`${p.dy}px`,
          animation:`particleUp ${p.dur}s ease-out ${p.delay}s forwards`,
          opacity:0,
          transform:`translate(${p.px}px,${p.py}px)`,
        }}/>
      ))}
    </div>
  );
}

/* ════════════════════════════════════════════
   Dice Tray
   ════════════════════════════════════════════ */
function DiceTray({visible}){
  return(
    <div style={{
      width:380,height:280,
      borderRadius:40,
      background:'radial-gradient(ellipse at 50% 30%, #0a2018 0%, #051210 60%, #020c09 100%)',
      border:'2.5px solid rgba(200,158,40,.6)',
      boxShadow:'0 0 40px rgba(200,158,40,.3),0 0 100px rgba(200,158,40,.1),inset 0 0 60px rgba(200,158,40,.06)',
      position:'relative',
      overflow:'hidden',
      opacity:visible?1:0,
      animation:visible?'trayIn .5s cubic-bezier(.2,.8,.2,1) both, trayPulse 2.8s ease-in-out 0.5s infinite':'none',
    }}>
      {/* felt texture lines */}
      {Array.from({length:12},(_,i)=>(
        <div key={i} style={{
          position:'absolute',left:0,right:0,
          top:`${(i/12)*100}%`,height:1,
          background:'rgba(255,255,255,.025)',
          transform:`rotate(${i%2===0?-1:1}deg)`,
        }}/>
      ))}
      {/* center ornament */}
      <div style={{
        position:'absolute',top:'50%',left:'50%',
        transform:'translate(-50%,-50%)',
        width:80,height:80,borderRadius:'50%',
        border:'1px solid rgba(200,158,40,.2)',
        boxShadow:'inset 0 0 20px rgba(200,158,40,.05)',
      }}/>
      <div style={{
        position:'absolute',top:'50%',left:'50%',
        transform:'translate(-50%,-50%)',
        width:50,height:50,borderRadius:'50%',
        border:'0.5px solid rgba(200,158,40,.15)',
      }}/>
      {/* corner decorations */}
      {[[8,8],[8,'auto'],[8,8],['auto',8]].map(([t,r],i)=>(
        <div key={i} style={{
          position:'absolute',
          top:i<2?10:'auto',bottom:i>=2?10:'auto',
          left:i%2===0?10:'auto',right:i%2===1?10:'auto',
          width:20,height:20,
          border:'1px solid rgba(200,158,40,.35)',
          borderRadius:4,
        }}/>
      ))}
    </div>
  );
}

/* ════════════════════════════════════════════
   Main Animation Component
   ════════════════════════════════════════════ */
function MahjongDiceAnimation({diceValues=[4,5],onAnimationComplete}){
  const [phase,setPhase]=useState('idle');
  const [shake,setShake]=useState(false);
  const [particle1,setParticle1]=useState(false);
  const [particle2,setParticle2]=useState(false);
  const [showResult,setShowResult]=useState(false);
  const containerRef=useRef(null);
  const total=diceValues[0]+diceValues[1];

  useEffect(()=>{
    let timers=[];
    const t=(fn,ms)=>{const id=setTimeout(fn,ms);timers.push(id);return id;};

    setPhase('tray');
    t(()=>{setPhase('rolling');setShake(true);},200);
    t(()=>setShake(false),450);
    t(()=>{setParticle1(true);setParticle2(true);},250);
    t(()=>{setParticle1(false);setParticle2(false);},750);
    // secondary bounce particles
    t(()=>{setParticle1(true);},390);
    t(()=>{setParticle1(false);},750);
    t(()=>setPhase('settling'),2000);
    t(()=>setPhase('stopped'),2400);
    t(()=>{setShowResult(true);},2600);
    t(()=>onAnimationComplete&&onAnimationComplete(),3400);

    return()=>timers.forEach(clearTimeout);
  },[]);

  const isRolling=phase==='rolling';
  const isSettling=phase==='settling';
  const isStopped=phase==='stopped'||showResult;
  const diceFreed=phase==='rolling'||phase==='settling'||phase==='stopped'||showResult;

  return(
    <div ref={containerRef} style={{
      width:'100vw',height:'100vh',
      display:'flex',alignItems:'center',justifyContent:'center',
      position:'relative',overflow:'hidden',
      background:'radial-gradient(ellipse at 50% 40%, #071428 0%, #040d1a 60%, #020810 100%)',
      animation:shake?'screenShake .22s ease-out':'none',
    }}>
      {/* Ambient background particles */}
      <AmbientParticles/>

      {/* Vignette */}
      <div style={{
        position:'absolute',inset:0,pointerEvents:'none',
        background:'radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,.7) 100%)',
        zIndex:1,
      }}/>

      {/* Main stage */}
      <div style={{position:'relative',zIndex:5}}>

        {/* Tray */}
        <DiceTray visible={phase!=='idle'}/>

        {/* Floor shadows inside tray */}
        {diceFreed&&(
          <>
            <div style={{
              position:'absolute',
              left:'calc(50% - 55px)',bottom:50,
              width:90,height:18,
              borderRadius:'50%',
              background:'rgba(0,0,0,.65)',
              transformOrigin:'center center',
              transform:'translate(-50%,0) scaleX(.85)',
              animation:'shadow1Anim 2.2s cubic-bezier(.2,.8,.2,1) both',
              filter:'blur(6px)',
            }}/>
            <div style={{
              position:'absolute',
              left:'calc(50% + 55px)',bottom:50,
              width:90,height:18,
              borderRadius:'50%',
              background:'rgba(0,0,0,.65)',
              transformOrigin:'center center',
              transform:'translate(-50%,0) scaleX(.84)',
              animation:'shadow2Anim 2.2s cubic-bezier(.2,.8,.2,1) both',
              filter:'blur(6px)',
            }}/>
          </>
        )}

        {/* ── FREE DICE ── */}
        {diceFreed&&(
          <div style={{
            position:'absolute',
            top:'50%',left:'50%',
            transform:'translate(-50%,-50%)',
            zIndex:25,
          }}>
            {/* Dice 1 */}
            <div style={{
              position:'absolute',
              top:-30,left:-5,
              animation:!isStopped
                ?`dice1Arc ${isSettling?'1.6s':'1.6s'} cubic-bezier(.1,.8,.2,1) ${isSettling?'.0s':'.0s'} both`
                :`dice1Arc 1.6s cubic-bezier(.1,.8,.2,1) both`,
              animationPlayState:isSettling?'paused':'running',
              transformOrigin:'45px 45px',
            }}>
              <div style={{
                animation:isStopped?'diceSettleGlow .4s ease-out forwards':'diceRollGlow .3s ease-in-out infinite',
              }}>
                <DiceSVG value={diceValues[0]} size={82} id="f1" rolling={isRolling}/>
              </div>
            </div>
            {/* Dice 2 */}
            <div style={{
              position:'absolute',
              top:-30,left:-5,
              animation:!isStopped
                ?`dice2Arc 1.6s cubic-bezier(.1,.8,.2,1) both`
                :`dice2Arc 1.6s cubic-bezier(.1,.8,.2,1) both`,
              animationPlayState:isSettling?'paused':'running',
              transformOrigin:'45px 45px',
            }}>
              <div style={{
                animation:isStopped?'diceSettleGlow .4s ease-out forwards':'diceRollGlow .3s ease-in-out .15s infinite',
              }}>
                <DiceSVG value={diceValues[1]} size={82} id="f2" rolling={isRolling}/>
              </div>
            </div>
          </div>
        )}

        {/* ── PARTICLES ── */}
        {diceFreed&&(
          <>
            <Particles active={particle1}
              originX={140} originY={155} count={16}/>
            <Particles active={particle2}
              originX={240} originY={155} count={16}/>
          </>
        )}
      </div>

      {/* ── RESULT OVERLAY ── */}
      {showResult&&(
        <div style={{
          position:'absolute',
          bottom:'12%',left:'50%',
          transform:'translateX(-50%)',
          zIndex:50,
          animation:'resultReveal .5s cubic-bezier(.2,.8,.2,1) both',
          textAlign:'center',
          minWidth:320,
        }}>
          <div style={{
            position:'relative',
            border:'1.5px solid rgba(200,158,40,.5)',
            borderRadius:16,
            padding:'14px 40px',
            background:'linear-gradient(135deg,rgba(10,18,40,.97),rgba(5,10,25,.97))',
            boxShadow:'0 0 60px rgba(200,158,40,.25),0 20px 40px rgba(0,0,0,.7)',
            overflow:'hidden',
            animation:'borderFlash 1.4s ease-in-out infinite',
          }}>
            {/* scan line */}
            <div style={{
              position:'absolute',top:0,left:0,right:0,height:'30%',
              background:'linear-gradient(transparent,rgba(200,158,40,.04),transparent)',
              animation:'scanLine 2.2s linear infinite',
              pointerEvents:'none',
            }}/>
            {/* top label */}
            <p style={{
              fontSize:13,letterSpacing:'0.3em',
              color:'rgba(200,158,40,.75)',
              fontFamily:"'Noto Serif TC',serif",
              marginBottom:6,
              textTransform:'uppercase',
            }}>開 局 點 數</p>
            {/* dice values */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:14,marginBottom:8}}>
              <DiceSVG value={diceValues[0]} size={48} id="r1"/>
              <span style={{color:'rgba(200,158,40,.6)',fontSize:22,fontWeight:300}}>+</span>
              <DiceSVG value={diceValues[1]} size={48} id="r2"/>
            </div>
            {/* total */}
            <div style={{
              fontSize:52,fontWeight:700,letterSpacing:'0.05em',
              color:'#ffd700',
              fontFamily:"'Georgia',serif",
              lineHeight:1,
              animation:'resultGlow 1.8s ease-in-out infinite',
              marginBottom:4,
            }}>
              {total}
            </div>
            <p style={{
              fontSize:12,color:'rgba(200,158,40,.5)',letterSpacing:'0.15em',
            }}>點</p>
          </div>
        </div>
      )}

      {/* ── TOP CORNER DECORATIONS ── */}
      <CornerDecor/>
    </div>
  );
}

/* ════════════════════════════════════════════
   Ambient Floating Particles (bg atmosphere)
   ════════════════════════════════════════════ */
function AmbientParticles(){
  const pts=useMemo(()=>Array.from({length:18},(_,i)=>({
    id:i,
    x:5+Math.random()*90,
    y:5+Math.random()*90,
    size:1+Math.random()*2.5,
    adx:(Math.random()-.5)*80,
    ady:-(20+Math.random()*60),
    delay:Math.random()*6,
    dur:4+Math.random()*4,
  })),[]);
  return(
    <div style={{position:'absolute',inset:0,pointerEvents:'none',zIndex:2}}>
      {pts.map(p=>(
        <div key={p.id} style={{
          position:'absolute',
          left:`${p.x}%`,top:`${p.y}%`,
          width:p.size,height:p.size,
          borderRadius:'50%',
          background:'rgba(200,158,40,.6)',
          '--adx':`${p.adx}px`,'--ady':`${p.ady}px`,
          animation:`ambientDrift ${p.dur}s ease-in-out ${p.delay}s infinite`,
        }}/>
      ))}
    </div>
  );
}

/* ════════════════════════════════════════════
   Corner HUD decorations
   ════════════════════════════════════════════ */
function CornerDecor(){
  const corners=[
    {top:16,left:16,rot:0},{top:16,right:16,rot:90},
    {bottom:16,left:16,rot:270},{bottom:16,right:16,rot:180},
  ];
  return(
    <>
      {corners.map((style,i)=>(
        <svg key={i} width={40} height={40} viewBox="0 0 40 40"
          style={{position:'absolute',...style,opacity:.35,zIndex:10,transform:`rotate(${style.rot}deg)`}}>
          <path d="M2,38 L2,2 L38,2" fill="none" stroke="rgba(200,158,40,.8)" strokeWidth="1.5"
            strokeLinecap="round"/>
          <circle cx="2" cy="2" r="2.5" fill="rgba(200,158,40,.6)"/>
        </svg>
      ))}
      {/* top bar */}
      <div style={{
        position:'absolute',top:0,left:'50%',transform:'translateX(-50%)',
        width:220,height:2,zIndex:10,
        background:'linear-gradient(90deg,transparent,rgba(200,158,40,.5),transparent)',
      }}/>
      <div style={{
        position:'absolute',bottom:0,left:'50%',transform:'translateX(-50%)',
        width:220,height:2,zIndex:10,
        background:'linear-gradient(90deg,transparent,rgba(200,158,40,.5),transparent)',
      }}/>
    </>
  );
}

root.render(
