<title>正方形版面 — 幾何規劃預覽 + Layout Self-Checker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1118;color:#e8e2d4;font-family:"Noto Sans TC",system-ui,sans-serif;padding:24px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:19px;color:#e7c66a}
.sub{color:#9aa3b0;font-size:12.5px;margin:3px 0 14px}
#banner{font-weight:800;font-size:15px;padding:10px 16px;border-radius:8px;margin-bottom:14px}
.ok{background:#10301c;color:#5fd38a;border:1px solid #2e7d4f}
.bad{background:#3a1414;color:#f08a8a;border:1px solid #7d2e2e}
.stagewrap{width:100%;overflow:auto;border-radius:8px}
.stage{position:relative;width:1280px;height:720px;transform-origin:top left;
  background:linear-gradient(180deg,#241a12,#15100a)}
.square{position:absolute;background-size:100% 100%;border-radius:6px}
.felt{position:absolute;border:1px dashed rgba(255,255,255,.18)}
.csq{position:absolute;border:1.5px dashed #e7c66a}
.circle{position:absolute;border-radius:50%;background:radial-gradient(circle,#0a1830,#04101f);
  border:2px solid #d4a843;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#e7c66a;font-weight:800}
.circle .w{font-size:18px}.circle .n{font-size:10px;color:#9aa3b0}
.el{position:absolute;border-width:1.5px;border-style:solid;border-radius:4px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:11px;line-height:1.3;color:#fff;text-shadow:0 1px 2px #000;overflow:hidden}
.el small{display:block;font-size:9px;opacity:.7}
.river{background:rgba(80,140,230,.20);border-color:rgba(80,140,230,.75)}
.hand{background:rgba(231,198,106,.20);border-color:rgba(231,198,106,.8)}
.meld{background:rgba(110,200,130,.18);border-color:rgba(110,200,130,.8)}
.info{background:rgba(165,170,185,.16);border-color:rgba(165,170,185,.7)}
#report{margin-top:16px;font-size:12.5px;line-height:1.7}
#report b{color:#e7c66a}
#report .grp{color:#9aa3b0;margin-top:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin:10px 0}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}

function overlapArea(a,b){const ox=Math.max(0,Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0));

function rectInside(a,c){return a.x0>=c.x0&&a.y0>=c.y0&&a.x1<=c.x1&&a.y1<=c.y1;}
function circleRectOverlap(c,r){const nx=Math.max(r.x0,Math.min(c.cx,r.x1));
  const ny=Math.max(r.y0,Math.min(c.cy,r.y1));const dx=c.cx-nx,dy=c.cy-ny;

  for(const n of ns){const e=ELEMENTS[n];if(e.zone==='felt')
    out.push({g:'絨布包含',test:n+' ⊆ FELT',pass:rectInside(e,FELT),detail:rectInside(e,FELT)?'':'超出絨布'});}
  for(const n of ns){const e=ELEMENTS[n];if(e.zone==='margin'){
    const inS=rectInside(e,{x0:0,y0:0,x1:STAGE.w,y1:STAGE.h}),hit=overlapArea(e,SQUARE)>0;
    out.push({g:'側邊面板',test:n,pass:inS&&!hit,detail:!inS?'超出畫面':(hit?'壓到方桌':'')});}}
  for(const n of ns){const e=ELEMENTS[n];
    const ok=e.x0>=0&&e.y0>=0&&e.x1<=STAGE.w&&e.y1<=STAGE.h;
    out.push({g:'螢幕邊界',test:n+' ⊆ STAGE',pass:ok,detail:ok?'':'超出邊界'});}
  for(const n of ns){const e=ELEMENTS[n];if(e.zone==='felt'){
    const hit=circleRectOverlap(CIRCLE,e);
    out.push({g:'中央圓圈',test:n,pass:!hit,detail:hit?'壓到圓圈':''});}}
  return out;
}

box('csq',CENTRAL_SQ);
const cd=document.createElement('div');cd.className='circle';
cd.style.left=(CIRCLE.cx-CIRCLE.r)+'px';cd.style.top=(CIRCLE.cy-CIRCLE.r)+'px';
cd.style.width=cd.style.height=(CIRCLE.r*2)+'px';
cd.innerHTML='<span class="w">東風</span><span class="n">中盤</span>';stage.appendChild(cd);
for(const n in ELEMENTS){const e=ELEMENTS[n];
  let cls='info';if(n.startsWith('river'))cls='river';else if(n.startsWith('hand'))cls='hand';
  else if(n.startsWith('meld'))cls='meld';
  box('el '+cls,e,LABELS[n]+'<small>'+e.x0+','+e.y0+'–'+e.x1+','+e.y1+'</small>');}
/* 自適應縮放 */
function fit(){const s=Math.min(1,(document.querySelector('.stagewrap').clientWidth)/1280);
  stage.style.transform='scale('+s+')';
  document.querySelector('.stagewrap').style.height=(720*s)+'px';}
fit();window.addEventListener('resize',fit);
/* ===== 執行 Layout Self-Checker ===== */
const res=runLayoutChecks();
const fail=res.filter(x=>!x.pass);
const banner=document.getElementById('banner');
if(fail.length===0){banner.className='ok';
  banner.textContent='✓ ALL PASSED — '+res.length+' 項幾何測試全數通過（重疊 / 超界 / 壓圓圈 = 0）';}
else{banner.className='bad';
  banner.textContent='✗ '+fail.length+' 項失敗 / 共 '+res.length+' 項';}
const groups={};res.forEach(r=>{groups[r.g]=groups[r.g]||{p:0,f:0};
  r.pass?groups[r.g].p++:groups[r.g].f++;});
let html='<b>Layout Self-Checker 報告</b><br>';
for(const g in groups)html+='<div class="grp">'+g+'：通過 '+groups[g].p+'，失敗 '+groups[g].f+'</div>';
if(fail.length)html+='<br><b style="color:#f08a8a">失敗項目：</b><br>'+
  fail.map(f=>'· '+f.test+' — '+f.detail).join('<br>');
document.getElementById('report').innerHTML=html;
</script></body></html>
